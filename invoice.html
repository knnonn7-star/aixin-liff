<header class="max-w-xl mx-auto bg-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center">
  <div>
    <h1 class="font-bold text-lg text-slate-800">🏥 愛欣診所 - 發票補登專區</h1>
    <p class="text-xs text-slate-500">櫃檯與會計進貨發票核對</p>
  </div>
  <div class="flex gap-2">
    <a href="admin.html" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center">📊 院長後台</a>
    <button onclick="loadPendingData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-bold">🔄 重新整理</button>
  </div>
</header>

  <main class="max-w-xl mx-auto space-y-3" id="list-container">
    <div class="text-center py-8 text-slate-400">資料載入中...</div>
  </main>

  <!-- 補登彈窗 Modal -->
  <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl my-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-bold text-slate-800">📝 補登發票與金額</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
      </div>

      <!-- QR Code 鏡頭掃描區 -->
      <div class="mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
        <button type="button" id="start-scan-btn" onclick="toggleScanner()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm">
          📷 開啟鏡頭掃描電子發票 QR Code
        </button>
        <div id="reader" class="hidden mt-3 rounded-lg overflow-hidden border border-slate-300"></div>
        <p class="text-xs text-slate-400 mt-2">請對準紙本電子發票「左側」的 QR Code 進行快速感應。</p>
      </div>

      <form id="modal-form" class="space-y-3">
        <input type="hidden" id="modal-id">

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">發票號碼 (可掃描或手動)</label>
          <input type="text" id="modal-invoice-no" placeholder="例：AB12345678" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 font-mono" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">發票實際總金額 (NT$)</label>
          <input type="number" id="modal-amount" placeholder="0" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">預計付款到期日 (請款日)</label>
          <input type="date" id="modal-due-date" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">拍照上傳發票憑證 (選填)</label>
          <input type="file" id="modal-invoice-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-sm">取消</button>
          <button type="submit" id="submit-btn" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700">儲存送出</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bvbknaaljuwxrzvoqcrt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fPdr9TBzrw9Ycb6GEpF7UA_zeLqblfo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let html5QrcodeScanner = null;

    async function loadPendingData() {
      const container = document.getElementById('list-container');
      container.innerHTML = '<div class="text-center py-8 text-slate-400">載入待補發票列表中...</div>';

      const { data, error } = await supabaseClient
        .from('cash_log')
        .select('*')
        .eq('status', 'pending_invoice')
        .order('created_at', { ascending: false });

      if (error) {
        alert('載入失敗：' + error.message);
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="bg-white rounded-2xl p-8 text-center text-slate-400 font-medium">🎉 目前沒有待補發票的進貨紀錄！</div>';
        return;
      }

      container.innerHTML = '';
      data.forEach(item => {
        const dateStr = new Date(item.created_at).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="bg-blue-50 text-blue-700 font-bold px-2.5 py-1 rounded-lg text-xs">${item.supplier || '未指定廠商'}</span>
              <span class="text-xs text-slate-400">${dateStr}</span>
            </div>
            <p class="text-sm text-slate-700 mb-1"><span class="font-semibold text-slate-900">點收人員：</span>${item.user_name || '未記錄'}</p>
            <p class="text-sm text-slate-700 mb-3"><span class="font-semibold text-slate-900">貨品說明：</span>${item.note || '無'}</p>
            ${item.receipt_url ? `<a href="${item.receipt_url}" target="_blank" class="inline-block text-xs bg-slate-100 text-slate-700 font-bold px-3 py-1.5 rounded-lg mb-3 border">📄 查看簽收單照片</a>` : ''}
          </div>
          <button onclick="openModal('${item.id}')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-sm transition">
            📝 補登發票資訊
          </button>
        `;
        container.appendChild(card);
      });
    }

    function openModal(id) {
      document.getElementById('modal-id').value = id;
      document.getElementById('modal-invoice-no').value = '';
      document.getElementById('modal-amount').value = '';
      
      const today = new Date();
      const nextMonthLastDay = new Date(today.getFullYear(), today.getMonth() + 2, 0);
      document.getElementById('modal-due-date').value = nextMonthLastDay.toISOString().split('T')[0];

      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      stopScanner();
      document.getElementById('modal').classList.add('hidden');
    }

    // 啟動 / 關閉 鏡頭掃描
    function toggleScanner() {
      const readerElem = document.getElementById('reader');
      const scanBtn = document.getElementById('start-scan-btn');

      if (html5QrcodeScanner) {
        stopScanner();
      } else {
        readerElem.classList.remove('hidden');
        scanBtn.innerText = "🛑 關閉鏡頭";
        scanBtn.className = "w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm";

        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            // 解析台灣電子發票左側 QR Code
            // 格式：前10碼為發票號碼 (例: AB12345678)
            if (decodedText && decodedText.length >= 10) {
              const invoiceNo = decodedText.substring(0, 10);
              // 驗證是否符合 2碼英文 + 8碼數字 格式
              if (/^[A-Z]{2}\d{8}$/i.test(invoiceNo)) {
                document.getElementById('modal-invoice-no').value = invoiceNo.toUpperCase();
                
                // 解析金額 (台灣電子發票 QR Code 16進位總金額位於第 29-36 碼)
                if (decodedText.length >= 36) {
                  const hexAmount = decodedText.substring(29, 36);
                  const parsedAmount = parseInt(hexAmount, 16);
                  if (!isNaN(parsedAmount) && parsedAmount > 0) {
                    document.getElementById('modal-amount').value = parsedAmount;
                  }
                }

                alert('✅ 已成功讀取發票號碼：' + invoiceNo.toUpperCase());
                stopScanner();
              }
            }
          },
          (errorMessage) => { /* 忽略掃描過程中的幀錯誤 */ }
        ).catch(err => {
          alert("無法啟動鏡頭，請確認已允許相機存取權限。");
          stopScanner();
        });
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          html5QrcodeScanner = null;
          document.getElementById('reader').classList.add('hidden');
          document.getElementById('start-scan-btn').innerText = "📷 開啟鏡頭掃描電子發票 QR Code";
          document.getElementById('start-scan-btn').className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm";
        }).catch(() => { html5QrcodeScanner = null; });
      }
    }

    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "處理中...";

      const id = document.getElementById('modal-id').value;
      const invoiceNo = document.getElementById('modal-invoice-no').value;
      const amount = parseFloat(document.getElementById('modal-amount').value);
      const dueDate = document.getElementById('modal-due-date').value;
      const invoiceFile = document.getElementById('modal-invoice-file').files[0];

      try {
        let invoiceUrl = null;
        if (invoiceFile) {
          const fileExt = invoiceFile.name.split('.').pop();
          const fileName = `inv_${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
          const filePath = `receipts/${fileName}`;

          const { error: uploadErr } = await supabaseClient.storage.from('receipts').upload(filePath, invoiceFile);
          if (uploadErr) throw uploadErr;

          const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(filePath);
          invoiceUrl = urlData.publicUrl;
        }

        const updatePayload = {
          invoice_no: invoiceNo,
          amount: amount,
          payment_due_date: dueDate,
          status: 'unpaid'
        };
        if (invoiceUrl) updatePayload.invoice_url = invoiceUrl;

        const { error: updateErr } = await supabaseClient
          .from('cash_log')
          .update(updatePayload)
          .eq('id', id);

        if (updateErr) throw updateErr;

        alert('✅ 發票補登成功！資料已轉交院長對帳與請款。');
        closeModal();
        loadPendingData();

      } catch (err) {
        alert('❌ 更新失敗：' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "儲存送出";
      }
    });

    loadPendingData();
  </script>
</body>
</html>
