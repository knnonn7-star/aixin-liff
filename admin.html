<header class="bg-slate-900 text-white p-4 shadow-md">
  <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2">
    <h1 class="text-xl font-bold flex items-center gap-2">🏥 愛欣診所 - 衛材進貨與應付帳款管理</h1>
    <div class="flex gap-2">
      <a href="invoice.html" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold transition flex items-center gap-1">📷 櫃檯發票補登</a>
      <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">🔄 重新整理</button>
    </div>
  </div>
</header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- 頁籤分頁 -->
    <div class="flex border-b border-slate-200 mb-6 gap-2">
      <button id="tab-pending" onclick="switchTab('pending_invoice')" class="py-3 px-5 font-bold border-b-2 border-blue-600 text-blue-600 text-sm md:text-base">
        📦 待補發票 <span id="count-pending" class="ml-1 bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
      <button id="tab-unpaid" onclick="switchTab('unpaid')" class="py-3 px-5 font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 text-sm md:text-base">
        ⏳ 待付款/應付帳款 <span id="count-unpaid" class="ml-1 bg-rose-100 text-rose-800 text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
      <button id="tab-paid" onclick="switchTab('paid')" class="py-3 px-5 font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 text-sm md:text-base">
        ✅ 已結案/歷史紀錄
      </button>
    </div>

    <!-- 統計卡片 (待付款頁籤顯示) -->
    <div id="unpaid-summary" class="hidden mb-6 bg-rose-50 border border-rose-200 rounded-xl p-4 flex justify-between items-center">
      <div>
        <p class="text-xs text-rose-600 font-semibold">當前待付款總金額</p>
        <p id="total-unpaid-amount" class="text-2xl font-black text-rose-700">NT$ 0</p>
      </div>
      <span class="text-xs bg-rose-200 text-rose-800 px-2.5 py-1 rounded-md font-bold">月結/季結追蹤</span>
    </div>

    <!-- 列表容器 -->
    <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- 動態載入卡片 -->
    </div>
  </main>

  <!-- 補登發票與請款 Modal -->
  <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">補登發票與請款資訊</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <form id="modal-form" class="space-y-4">
        <input type="hidden" id="modal-id">
        
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">發票號碼</label>
          <input type="text" id="modal-invoice-no" placeholder="例：AB12345678" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">發票實際總金額 (NT$)</label>
          <input type="number" id="modal-amount" placeholder="0" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">預計付款到期日 (請款日)</label>
          <input type="date" id="modal-due-date" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">上傳發票照片 (選填)</label>
          <input type="file" id="modal-invoice-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-sm hover:bg-slate-200">取消</button>
          <button type="submit" id="modal-submit-btn" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700">儲存並移至待付款</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bvbknaaljuwxrzvoqcrt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fPdr9TBzrw9Ycb6GEpF7UA_zeLqblfo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'pending_invoice';
    let allData = [];

    async function loadData() {
      const { data, error } = await supabaseClient
        .from('cash_log')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('載入失敗：' + error.message);
        return;
      }

      allData = data || [];
      updateCounts();
      renderList();
    }

    function updateCounts() {
      const pending = allData.filter(d => d.status === 'pending_invoice');
      const unpaid = allData.filter(d => d.status === 'unpaid');
      
      document.getElementById('count-pending').innerText = pending.length;
      document.getElementById('count-unpaid').innerText = unpaid.length;

      const totalUnpaid = unpaid.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      document.getElementById('total-unpaid-amount').innerText = `NT$ ${totalUnpaid.toLocaleString()}`;
    }

    function switchTab(tab) {
      currentTab = tab;
      ['pending_invoice', 'unpaid', 'paid'].forEach(t => {
        const btn = document.getElementById(t === 'pending_invoice' ? 'tab-pending' : t === 'unpaid' ? 'tab-unpaid' : 'tab-paid');
        if (t === tab) {
          btn.className = "py-3 px-5 font-bold border-b-2 border-blue-600 text-blue-600 text-sm md:text-base";
        } else {
          btn.className = "py-3 px-5 font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 text-sm md:text-base";
        }
      });

      document.getElementById('unpaid-summary').classList.toggle('hidden', tab !== 'unpaid');
      renderList();
    }

    function renderList() {
      const container = document.getElementById('list-container');
      container.innerHTML = '';

      let filtered = allData.filter(d => {
        if (currentTab === 'pending_invoice') return d.status === 'pending_invoice';
        if (currentTab === 'unpaid') return d.status === 'unpaid';
        if (currentTab === 'paid') return d.status === 'paid' || d.status === 'pending' || !d.status;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">尚無此分類下的資料</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between";
        
        const dateStr = new Date(item.created_at).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="bg-slate-100 text-slate-700 font-bold px-2.5 py-1 rounded-lg text-xs">
                ${item.supplier || item.category || '一般登記'}
              </span>
              <span class="text-xs text-slate-400">${dateStr}</span>
            </div>

            <div class="space-y-1 mb-4 text-sm">
              <p class="text-slate-600"><span class="font-semibold text-slate-800">點收同仁：</span>${item.user_name || '未記錄'}</p>
              <p class="text-slate-600"><span class="font-semibold text-slate-800">進貨說明：</span>${item.note || '無備註'}</p>
              ${item.invoice_no ? `<p class="text-slate-600"><span class="font-semibold text-slate-800">發票號碼：</span><span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-blue-700">${item.invoice_no}</span></p>` : ''}
              ${item.payment_due_date ? `<p class="text-slate-600"><span class="font-semibold text-slate-800">付款到期日：</span><span class="text-rose-600 font-bold">${item.payment_due_date}</span></p>` : ''}
            </div>

            ${item.amount ? `<div class="text-xl font-bold text-slate-900 mb-4">NT$ ${Number(item.amount).toLocaleString()}</div>` : `<div class="text-sm font-semibold text-amber-600 mb-4">⚠️ 待補發票與金額</div>`}
            
            <div class="flex gap-2 mb-4">
              ${item.receipt_url ? `<a href="${item.receipt_url}" target="_blank" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg border border-slate-300">📄 查看簽收單</a>` : ''}
              ${item.invoice_url ? `<a href="${item.invoice_url}" target="_blank" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-1.5 rounded-lg border border-blue-200">🧾 查看發票照片</a>` : ''}
            </div>
          </div>

          <div>
            ${currentTab === 'pending_invoice' ? `
              <button onclick="openModal('${item.id}')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-xl text-sm transition">
                📝 補登發票與金額
              </button>
            ` : ''}

            ${currentTab === 'unpaid' ? `
              <button onclick="markAsPaid('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-xl text-sm transition">
                💵 完成付款與核銷
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(id) {
      document.getElementById('modal-id').value = id;
      document.getElementById('modal-invoice-no').value = '';
      document.getElementById('modal-amount').value = '';
      
      const today = new Date();
      const nextMonthLastDay = new Date(today.getFullYear(), today.getMonth() + 2, 0);
      document.getElementById('modal-due-date').value = nextMonthLastDay.toISOString().split('T')[0];

      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('modal-submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "處理中...";

      const id = document.getElementById('modal-id').value;
      const invoiceNo = document.getElementById('modal-invoice-no').value;
      const amount = parseFloat(document.getElementById('modal-amount').value);
      const dueDate = document.getElementById('modal-due-date').value;
      const invoiceFile = document.getElementById('modal-invoice-file').files[0];

      try {
        let invoiceUrl = null;
        if (invoiceFile) {
          const fileExt = invoiceFile.name.split('.').pop();
          const fileName = `inv_${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
          const filePath = `receipts/${fileName}`;

          const { error: uploadErr } = await supabaseClient.storage.from('receipts').upload(filePath, invoiceFile);
          if (uploadErr) throw uploadErr;

          const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(filePath);
          invoiceUrl = urlData.publicUrl;
        }

        const updatePayload = {
          invoice_no: invoiceNo,
          amount: amount,
          payment_due_date: dueDate,
          status: 'unpaid'
        };
        if (invoiceUrl) updatePayload.invoice_url = invoiceUrl;

        const { error: updateErr } = await supabaseClient
          .from('cash_log')
          .update(updatePayload)
          .eq('id', id);

        if (updateErr) throw updateErr;

        alert('✅ 發票與金額已成功補登，此筆項目已轉入「待付款/應付帳款」清單！');
        closeModal();
        loadData();

      } catch (err) {
        alert('❌ 更新失敗：' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "儲存並移至待付款";
      }
    });

    async function markAsPaid(id) {
      if (!confirm('確定要將此筆款項標記為「已完成付款」並結案嗎？')) return;

      const { error } = await supabaseClient
        .from('cash_log')
        .update({ status: 'paid' })
        .eq('id', id);

      if (error) {
        alert('❌ 標記失敗：' + error.message);
        return;
      }

      alert('✅ 已成功結案！');
      loadData();
    }

    loadData();
  </script>
</body>
</html>
