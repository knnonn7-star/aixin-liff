<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愛欣診所 - 管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 使用輕量化掃描庫 -->
  <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 flex flex-col items-center">

  <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-4 my-auto">
    <h1 class="text-xl font-bold text-slate-800 text-center mb-4">🏥 愛欣診所管理系統</h1>
    
    <!-- 主功能選單 -->
    <section id="sec-main-menu" class="space-y-3">
      <button onclick="openSubPage('register')" class="w-full bg-blue-600 text-white font-bold p-4 rounded-2xl">📦 現場登記</button>
      <button onclick="openSubPage('invoice')" class="w-full bg-amber-500 text-white font-bold p-4 rounded-2xl">📷 櫃檯補登</button>
      <button onclick="openSubPage('admin')" class="w-full bg-slate-800 text-white font-bold p-4 rounded-2xl">📊 院長對帳</button>
    </section>

    <!-- 第二層介面 -->
    <div id="sub-page-header" class="hidden mb-4 pb-2 border-b flex justify-between items-center">
      <button onclick="backToMainMenu()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-bold">⬅️ 返回</button>
      <span id="sub-page-title" class="text-xs font-bold"></span>
    </div>

    <section id="sec-register" class="hidden space-y-4">
      <!-- 簡化後的進貨模式 -->
      <form id="cash-form" class="space-y-4">
        <!-- (保留原有登記欄位) -->
        <label class="block text-xs font-bold text-slate-700">選擇憑證模式</label>
        <div class="grid grid-cols-2 gap-2">
            <label class="p-2 border rounded-xl text-xs font-bold cursor-pointer"><input type="radio" name="doc_mode" value="receipt_only" checked onchange="toggleDocMode()"> 📄 拍照簽收單</label>
            <label class="p-2 border rounded-xl text-xs font-bold cursor-pointer bg-emerald-50"><input type="radio" name="doc_mode" value="has_invoice" onchange="toggleDocMode()"> 🧾 掃描發票</label>
        </div>
        
        <div id="doc-receipt-box" class="p-3 border rounded-xl">
            <input type="file" id="receipt" accept="image/*" class="w-full text-xs">
        </div>

        <div id="doc-invoice-box" class="hidden p-3 border rounded-xl bg-emerald-50">
            <label class="block text-xs font-bold mb-2">📸 點擊下方拍照自動識別發票</label>
            <input type="file" id="reg-qr-file" accept="image/*" capture="environment" class="w-full text-xs bg-white p-2 rounded" onchange="handleFileQr(this, 'reg-invoice-no', 'amount')">
            <input type="text" id="reg-invoice-no" placeholder="發票號碼" class="w-full p-2 mt-2 border rounded text-xs">
            <input type="number" id="amount" placeholder="金額" class="w-full p-2 mt-2 border rounded text-xs">
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">送出</button>
      </form>
    </section>
  </div>

  <script>
    // 使用 ZXing 庫進行離線靜態圖片解析，解決鏡頭閃爍問題
    async function handleFileQr(input, noId, amtId) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = async (e) => {
            const img = new Image();
            img.onload = async () => {
                const codeReader = new ZXing.BrowserMultiFormatReader();
                try {
                    const result = await codeReader.decodeFromImage(img);
                    const parsed = parseInvoiceQr(result.text);
                    if (parsed) {
                        document.getElementById(noId).value = parsed.invoiceNo;
                        if (parsed.amount) document.getElementById(amtId).value = parsed.amount;
                        alert('✅ 辨識成功！');
                    } else {
                        alert('⚠️ 讀取成功但非電子發票格式，請手動確認資訊。');
                    }
                } catch (err) {
                    alert('⚠️ 無法辨識圖片中的條碼，請確認發票清晰度。');
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function parseInvoiceQr(text) {
        if (!text || text.length < 10) return null;
        const invNo = text.substring(0, 10);
        if (!/^[A-Z]{2}\d{8}$/i.test(invNo)) return null;
        let amt = null;
        if (text.length >= 37) {
            const hex = text.substring(29, 37);
            const val = parseInt(hex, 16);
            if (!isNaN(val) && val > 0) amt = val;
        }
        return { invoiceNo: invNo.toUpperCase(), amount: amt };
    }
    
    // 原有 openSubPage, backToMainMenu, etc. 邏輯保持不變...
  </script>
</body>
</html>
