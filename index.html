<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愛欣診所 - 金流與零用金登記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 my-auto">
    <!-- 標頭 -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800 flex items-center justify-center gap-2">
        🏥 愛欣診所管理系統
      </h1>
      <p class="text-sm text-slate-500 mt-1">金流與零用金即時登記</p>
    </div>

    <!-- 登記人員資訊 -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-6 flex justify-between items-center text-sm">
      <span class="text-slate-600 font-medium">登記人員：</span>
      <span id="user-name" class="font-bold text-slate-800 bg-slate-200 px-3 py-1 rounded-md">載入中...</span>
    </div>

    <!-- 登記表單 -->
    <form id="cash-form" class="space-y-4">
      
      <!-- 1. 交易類型選擇 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">交易類型</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center p-3 border-2 border-emerald-500 bg-emerald-50 text-emerald-800 rounded-xl cursor-pointer hover:bg-emerald-100 transition font-bold">
            <input type="radio" name="type" value="income" checked onchange="updateCategories()" class="w-4 h-4 text-emerald-600 mr-2">
            💰 收入
          </label>
          <label class="flex items-center justify-center p-3 border-2 border-rose-500 bg-rose-50 text-rose-800 rounded-xl cursor-pointer hover:bg-rose-100 transition font-bold">
            <input type="radio" name="type" value="expense" onchange="updateCategories()" class="w-4 h-4 text-rose-600 mr-2">
            💸 支出
          </label>
        </div>
      </div>

      <!-- 2. 金流分類動態選單 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">金流分類</label>
        <select id="category" class="w-full p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" required>
          <!-- 會由 JavaScript 自動寫入選項 -->
        </select>
      </div>

      <!-- 3. 金額輸入 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">金額 (NT$)</label>
        <input type="number" id="amount" min="1" placeholder="0" class="w-full p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <!-- 4. 上傳照片 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">上傳發票/收據照片</label>
        <input type="file" id="receipt" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <p class="text-xs text-slate-400 mt-1">點擊可直接開啟手機相機拍照。</p>
      </div>

      <!-- 5. 備註欄位 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">備註說明</label>
        <textarea id="note" rows="2" placeholder="例如：購買洗腎室消毒用酒精2罐" class="w-full p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md hover:bg-blue-700 active:scale-[0.98] transition duration-150">
        確認登記送出
      </button>
    </form>
  </div>

  <script>
    // ==================== 【設定參數】 ====================
    const LIFF_ID = '2011071479-1rEMTEv0'; 
    const SUPABASE_URL = 'https://bvbknaaljuwxrzvoqcrt.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_fPdr9TBzrw9Ycb6GEpF7UA_zeLqblfo'; 
    // ====================================================

    // 分類選單資料設定
    const categoryOptions = {
      income: [
        '自費門診收入',
        '自費衛材收入',
        '洗腎相關自費',
        '其他收入'
      ],
      expense: [
        '文具雜項',
        '清潔衛生用品',
        '餐飲茶水',
        '郵資快遞',
        '車資旅費',
        '維修保養',
        '其他零用金支出'
      ]
    };

    // 動態更新分類選單
    function updateCategories() {
      const type = document.querySelector('input[name="type"]:checked').value;
      const categorySelect = document.getElementById('category');
      categorySelect.innerHTML = '';

      categoryOptions[type].forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.innerText = item;
        categorySelect.appendChild(option);
      });
    }

    // 初始化 Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = { lineUserId: '', displayName: '匿名同仁' };

    // 初始化 LINE LIFF
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUser.lineUserId = profile.userId;
          currentUser.displayName = profile.displayName;
          document.getElementById('user-name').innerText = currentUser.displayName;
        }
      } catch (err) {
        console.error("LIFF 初始化失敗:", err);
        document.getElementById('user-name').innerText = "訪客模式 / 測試中";
        currentUser.lineUserId = "TEST_USER_123";
      }
    }

    // 啟動頁面選單與 LIFF
    updateCategories();
    initLiff();

    // 表單提交處理
    document.getElementById('cash-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "資料處理解析中...";

      try {
        const type = document.querySelector('input[name="type"]:checked').value;
        const category = document.getElementById('category').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const note = document.getElementById('note').value;
        const receiptFile = document.getElementById('receipt').files[0];

        let receiptUrl = null;

        if (receiptFile) {
          submitBtn.innerText = "照片上傳中...";
          const fileExt = receiptFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
          const filePath = `receipts/${fileName}`;

          const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('receipts')
            .upload(filePath, receiptFile);

          if (uploadError) throw uploadError;

          const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(filePath);
          receiptUrl = urlData.publicUrl;
        }

        submitBtn.innerText = "寫入資料庫中...";
        const { data, error } = await supabaseClient
          .from('cash_log')
          .insert([
            {
              line_user_id: currentUser.lineUserId || 'UNKNOWN_USER',
              user_name: currentUser.displayName,
              type: type,
              category: category,
              amount: amount,
              receipt_url: receiptUrl,
              note: note,
              status: 'pending'
            }
          ]);

        if (error) throw error;

        alert('✅ 登記成功！資料已同步至雲端。');
        document.getElementById('cash-form').reset();
        updateCategories(); // 重置選單狀態

        if (liff.isInClient()) {
          liff.closeWindow();
        }

      } catch (err) {
        alert('❌ 登記失敗：' + err.message);
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "確認登記送出";
      }
    });
  </script>
</body>
</html>
