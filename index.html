<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愛欣診所 - 洗腎接送與車資回報系統</title>
  <!-- Tailwind CSS 樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 text-slate-800">

  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
    
    <!-- 頁首標題 -->
    <div class="bg-teal-600 text-white p-4 text-center">
      <h1 class="text-xl font-bold">愛欣診所 洗腎接送回報</h1>
      <p class="text-xs text-teal-100 mt-1" id="driver-info">載入司機資訊中...</p>
    </div>

    <form id="fare-form" class="p-5 space-y-5">
      
      <!-- 路線選擇 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">1. 選擇今日負責路線 / 區域</label>
        <select id="route-select" onchange="updatePatientList()" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:ring-2 focus:ring-teal-500 focus:outline-none">
          <option value="">-- 請選擇路線 --</option>
          <option value="A">苓雅 A 線 (自強/青年路段)</option>
          <option value="B">前鎮 B 線 (三多/光華路段)</option>
          <option value="C">鳳山 C 線 (五甲路段)</option>
        </select>
      </div>

      <!-- 病患勾選區域 -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-sm font-semibold text-slate-700">2. 勾選實際搭乘病患</label>
          <span class="text-xs text-slate-500" id="passenger-count">已選 0 人</span>
        </div>
        <div id="patient-checkboxes" class="space-y-2 border border-slate-200 rounded-lg p-3 bg-slate-50 min-h-[100px]">
          <p class="text-slate-400 text-sm text-center py-4">請先選擇上方路線</p>
        </div>
      </div>

      <!-- 車資對比與輸入 -->
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 space-y-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-600">系統合約預估車資：</span>
          <span class="font-bold text-teal-700 text-base" id="estimated-fare">$0 元</span>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">3. 輸入收據/跳錶實際金額 (元)</label>
          <input type="number" id="actual-fare" oninput="checkFareDiff()" placeholder="例如：200" required class="w-full border border-slate-300 rounded-lg p-2.5 text-lg font-bold text-slate-800 focus:ring-2 focus:ring-teal-500 focus:outline-none">
        </div>

        <!-- 金額異常警示與原因輸入 -->
        <div id="warning-box" class="hidden space-y-2 pt-2 border-t border-amber-200">
          <p class="text-xs text-amber-700 font-semibold">⚠️ 實際金額高於合約預估，請選擇加價原因：</p>
          <select id="extra-reason" class="w-full text-sm border border-amber-300 rounded-lg p-2 bg-white">
            <option value="路況塞車繞道">路況塞車繞道</option>
            <option value="協助輪椅上下樓費">協助輪椅上下樓服務費</option>
            <option value="等候病患時間較長">等候病患時間較長</option>
            <option value="其他原因">其他原因</option>
          </select>
        </div>
      </div>

      <!-- 照片上傳 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">4. 拍照上傳計程車收據 / 發票</label>
        <input type="file" id="receipt-photo" accept="image/*" capture="environment" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 disabled:opacity-50">
        確認送出回報
      </button>

    </form>
  </div>

  <script>
    // 預設路線與病患清單（測試用，後續可串接 Supabase / Google Sheets）
    const routeData = {
      "A": [
        { id: "P001", name: "張先生 (自強路)" },
        { id: "P002", name: "李太太 (青年路)" },
        { id: "P003", name: "陳爺爺 (成功路)" }
      ],
      "B": [
        { id: "P004", name: "王大哥 (三多路)" },
        { id: "P005", name: "林阿姨 (光華路)" }
      ],
      "C": [
        { id: "P006", name: "蔡先生 (五甲路)" },
        { id: "P007", name: "黃奶奶 (保泰路)" }
      ]
    };

    // 車資計算公式：基本趟 $150 + 每多載 1 人 + $50
    const BASE_FARE = 150;
    const EXTRA_PERSON_FARE = 50;

    let currentEstimatedFare = 0;
    let userId = "";

    // 1. LIFF 初始化
    window.onload = function() {
      liff.init({ liffId: "2011084510-2Rv9CVUh" })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              userId = profile.userId;
              document.getElementById("driver-info").innerText = `司機：${profile.displayName}`;
            });
          }
        })
        .catch(err => {
          console.error("LIFF 初始化失敗", err);
          document.getElementById("driver-info").innerText = "LIFF 初始化失敗，請於 LINE 內開啟";
        });
    };

    // 2. 切換路線更新病患名單
    function updatePatientList() {
      const route = document.getElementById("route-select").value;
      const container = document.getElementById("patient-checkboxes");
      container.innerHTML = "";

      if (!route || !routeData[route]) {
        container.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">請先選擇上方路線</p>';
        calculateFare(0);
        return;
      }

      routeData[route].forEach(patient => {
        const label = document.createElement("label");
        label.className = "flex items-center space-x-3 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-teal-50";
        label.innerHTML = `
          <input type="checkbox" value="${patient.id}" onchange="onPatientChange()" class="w-4 h-4 text-teal-600 rounded focus:ring-teal-500">
          <span class="text-sm font-medium text-slate-700">${patient.name}</span>
        `;
        container.appendChild(label);
      });

      onPatientChange();
    }

    // 3. 勾選病患時計算預估車資
    function onPatientChange() {
      const checkedBoxes = document.querySelectorAll('#patient-checkboxes input[type="checkbox"]:checked');
      const count = checkedBoxes.length;
      document.getElementById("passenger-count").innerText = `已選 ${count} 人`;
      calculateFare(count);
    }

    function calculateFare(count) {
      if (count === 0) {
        currentEstimatedFare = 0;
      } else {
        currentEstimatedFare = BASE_FARE + (count - 1) * EXTRA_PERSON_FARE;
      }
      document.getElementById("estimated-fare").innerText = `$${currentEstimatedFare} 元`;
      checkFareDiff();
    }

    // 4. 比對預估車資與實際輸入車資
    function checkFareDiff() {
      const actualFare = Number(document.getElementById("actual-fare").value) || 0;
      const warningBox = document.getElementById("warning-box");

      if (actualFare > currentEstimatedFare && currentEstimatedFare > 0) {
        warningBox.classList.remove("hidden");
      } else {
        warningBox.classList.add("hidden");
      }
    }

    // 5. 表單送出處理
    document.getElementById("fare-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const route = document.getElementById("route-select").value;
      const actualFare = document.getElementById("actual-fare").value;

      if (!route) {
        alert("請選擇路線！");
        return;
      }

      if (!actualFare) {
        alert("請輸入實際車資金額！");
        return;
      }

      // 發送訊息回到 LINE 聊天室並關閉 LIFF
      if (liff.isLoggedIn()) {
        const checkedBoxes = document.querySelectorAll('#patient-checkboxes input[type="checkbox"]:checked');
        const count = checkedBoxes.length;
        const isWarning = Number(actualFare) > currentEstimatedFare;
        const reason = isWarning ? document.getElementById("extra-reason").value : "金額正常";

        const msg = `🚗【愛欣診所 - 洗腎車資回報】\n` +
                    `• 路線：${route} 線\n` +
                    `• 實際搭乘：${count} 人\n` +
                    `• 合約預算：$${currentEstimatedFare} 元\n` +
                    `• 回報車資：$${actualFare} 元\n` +
                    `• 狀態：${isWarning ? '⚠️ 異常 (' + reason + ')' : '✅ 正常'}`;

        liff.sendMessages([{
          type: 'text',
          text: msg
        }]).then(() => {
          alert("回報成功！");
          liff.closeWindow();
        }).catch((err) => {
          alert("發送訊息失敗：" + err);
        });
      } else {
        alert("請在 LINE 應用程式內操作");
      }
    });
  </script>
</body>
</html>
