<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愛欣診所 - 金流與零用金登記</title>
  <!-- Bootstrap 5 CSS (前端美化樣式) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .btn-primary { background-color: #0d6efd; border: none; }
  </style>
</head>
<body>

<div class="container py-4" style="max-width: 500px;">
  <!-- 診所頁首 -->
  <div class="text-center mb-4">
    <h4 class="fw-bold text-primary">🏥 愛欣診所管理系統</h4>
    <p class="text-muted small">金流與零用金即時登記</p>
  </div>

  <!-- 同仁登入卡片 -->
  <div class="card mb-3">
    <div class="card-body d-flex align-items-center justify-content-between py-2">
      <span class="small text-muted">登記人員：</span>
      <span id="user-name" class="fw-bold text-dark">載入中...</span>
    </div>
  </div>

  <!-- 登記表單 -->
  <div class="card p-3">
    <form id="cash-form">
      <!-- 交易類型 -->
      <div class="mb-3">
        <label class="form-label fw-bold">交易類型</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="type" id="type-income" value="income" checked>
          <label class="btn btn-outline-success" for="type-income">💰 自費收入</label>

          <input type="radio" class="btn-check" name="type" id="type-expense" value="expense">
          <label class="btn btn-outline-danger" for="type-expense">💸 零用金支出</label>
        </div>
      </div>

      <!-- 金流分類 -->
      <div class="mb-3">
        <label for="category" class="form-label fw-bold">金流分類</label>
        <select class="form-select" id="category" required>
          <option value="" disabled selected>請選擇分類...</option>
          <option value="自費衛材">自費衛材/營養品</option>
          <option value="補單費">門診補單/自費掛號</option>
          <option value="文具雜項">診所文具/耗材買置</option>
          <option value="餐費代墊">同仁餐費/加班代墊</option>
          <option value="計程車費">計程車接送代墊</option>
          <option value="其他">其他雜項</option>
        </select>
      </div>

      <!-- 金額 -->
      <div class="mb-3">
        <label for="amount" class="form-label fw-bold">金額 (NT$)</label>
        <input type="number" class="form-control form-control-lg" id="amount" placeholder="0" min="1" required>
      </div>

      <!-- 拍照/上傳憑證 -->
      <div class="mb-3">
        <label for="receipt" class="form-label fw-bold">上傳發票/收據照片</label>
        <input class="form-control" type="file" id="receipt" accept="image/*" capture="environment">
        <div class="form-text">點擊可直接開啟手機相機拍照。</div>
      </div>

      <!-- 備註 -->
      <div class="mb-3">
        <label for="note" class="form-label fw-bold">備註說明</label>
        <textarea class="form-control" id="note" rows="2" placeholder="例如：購買洗腎室消毒用酒精2罐"></textarea>
      </div>

      <!-- 提交按鈕 -->
      <button type="submit" id="submit-btn" class="btn btn-primary w-100 btn-lg fw-bold">確認登記送出</button>
    </form>
  </div>
</div>

<script>

// ==================== 【請修改此處的設定參數】 ====================
const LIFF_ID = '2011071479-1rEMTEv0';
const SUPABASE_URL = 'https://bvbknaaljuwxrzvoqcrt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fPdr9TBzrw9Ycb6GEpF7UA_zeLqblfo';
// ================================================================



  // 初始化 Supabase
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = { lineUserId: '', displayName: '匿名同仁' };

  // 初始化 LINE LIFF
  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        const profile = await liff.getProfile();
        currentUser.lineUserId = profile.userId;
        currentUser.displayName = profile.displayName;
        document.getElementById('user-name').innerText = currentUser.displayName;
      }
    } catch (err) {
      console.error("LIFF 初始化失敗:", err);
      document.getElementById('user-name').innerText = "測試模式 (無 LINE API)";
      currentUser.lineUserId = "TEST_USER_123";
    }
  }

  initLiff();

  // 表單提交處理
  document.getElementById('cash-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerText = "資料處理解析中...";

    try {
      const type = document.querySelector('input[name="type"]:checked').value;
      const category = document.getElementById('category').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const note = document.getElementById('note').value;
      const receiptFile = document.getElementById('receipt').files[0];

      let receiptUrl = null;

      // 1. 若有拍照，先上傳至 Supabase Storage
      if (receiptFile) {
        submitBtn.innerText = "照片上傳中...";
        const fileExt = receiptFile.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `receipts/${fileName}`;

        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('receipts')
          .upload(filePath, receiptFile);

        if (uploadError) throw uploadError;

        // 取得公開下載網址
        const { data: urlData } = supabase.storage.from('receipts').getPublicUrl(filePath);
        receiptUrl = urlData.publicUrl;
      }

      // 2. 寫入 Supabase cash_log 資料表
      submitBtn.innerText = "寫入資料庫中...";
      const { data, error } = await supabase
        .from('cash_log')
        .insert([
          {
            line_user_id: currentUser.lineUserId,
            user_name: currentUser.displayName,
            type: type,
            category: category,
            amount: amount,
            receipt_url: receiptUrl,
            note: note,
            status: 'pending'
          }
        ]);

      if (error) throw error;

      alert('✅ 登記成功！零用金/收入資料已同步至雲端。');
      document.getElementById('cash-form').reset();

      // 關閉 LIFF 視窗回到 LINE 對話框
      if (liff.isInClient()) {
        liff.closeWindow();
      }

    } catch (err) {
      alert('❌ 登記失敗：' + err.message);
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "確認登記送出";
    }
  });
</script>
</body>
</html>
